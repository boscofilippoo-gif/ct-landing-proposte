<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anteprima smartphone — CT Consulting</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#26211D">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap');
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#26211D;color:#F6F2EC;font:300 1rem/1.5 'Jost','Helvetica Neue',Arial,sans-serif;min-height:100svh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem clamp(1rem,3vw,2rem);border-bottom:1px solid #3A332D}
  header p{margin:0;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#A89C8F}
  header strong{font-weight:400;color:#F6F2EC;letter-spacing:.06em}
  .azioni{display:flex;gap:.5rem;flex-wrap:wrap}
  a.btn{display:inline-flex;align-items:center;min-height:40px;padding:.55rem 1rem;border-radius:999px;text-decoration:none;color:inherit;border:1px solid rgba(246,242,236,.35);font-size:.78rem;letter-spacing:.06em;transition:background-color .3s,border-color .3s,color .3s}
  a.btn:hover{border-color:#B79668;color:#B79668}
  a.btn.pieno{background:#B79668;border-color:#B79668;color:#26211D}
  a.btn.pieno:hover{background:#F6F2EC;border-color:#F6F2EC;color:#26211D}
  main{flex:1;display:grid;place-items:center;padding:clamp(1rem,3vh,2rem) 1rem}
  .telefono{position:relative;width:390px;max-width:100%;aspect-ratio:390/844;border-radius:36px;padding:10px;background:#0F0D0B;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);transform-origin:center}
  .telefono iframe{width:100%;height:100%;border:0;border-radius:27px;background:#fff;display:block}
  footer{padding:0 clamp(1rem,3vw,2rem) 1.4rem;color:#8E8378;font-size:.75rem;text-align:center}
  @media (max-width:760px){
    .telefono{width:100%;aspect-ratio:auto;height:100%;border-radius:0;padding:0;box-shadow:none}
    .telefono iframe{border-radius:0}
    main{padding:0}
  }
</style>
</head>
<body>
  <header>
    <p>Anteprima smartphone — <strong id="nome">landing</strong></p>
    <div class="azioni">
      <a class="btn" href="index.html">Torna alle tre proposte</a>
      <a class="btn pieno" id="apri" href="#" target="_blank" rel="noopener">Apri a tutta pagina</a>
    </div>
  </header>
  <main><div class="telefono" id="telefono"><iframe id="quadro" title="Anteprima della landing"></iframe></div></main>
  <footer>Su computer la pagina è mostrata in una cornice da smartphone, così com'è per chi arriva dal QR code.</footer>
<script>
(function(){
  var pagine={a:{f:'a.html',n:'A — Marmo'},b:{f:'b.html',n:'B — Il cerchio'},c:{f:'c.html',n:'C — Cinematica'}};
  var k=(new URLSearchParams(location.search).get('p')||'a').toLowerCase();
  var p=pagine[k]||pagine.a;
  document.getElementById('quadro').src=p.f;
  document.getElementById('nome').textContent=p.n;
  document.getElementById('apri').href=p.f;
  var tel=document.getElementById('telefono');
  function scala(){
    tel.style.transform='';
    if(window.innerWidth<=760) return;
    var m=document.querySelector('main'), disp=m.clientHeight-32, alt=tel.offsetHeight;
    var s=Math.min(1, disp/alt);
    tel.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',scala); setTimeout(scala,60); scala();
})();
</script>
</body>
</html>
